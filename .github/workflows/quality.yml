name: Quality

on:
  push:
    paths:
      - 'src/**'
      - 'tools/qa/**'
      - '.github/workflows/quality.yml'
      - 'composer.json'
      - 'Makefile'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/qa/**'
      - '.github/workflows/quality.yml'
      - 'composer.json'
      - 'Makefile'

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.pkg }} (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    defaults:
      run:
        working-directory: src/${{ matrix.pkg }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5']
        composer_args: ['']
        include:
          - php-version: '8.6'
            experimental: true
            composer_args: "--ignore-platform-reqs"
        pkg:
          - AsyncIt
          - CommandIt
          - CommitIt
          - CommitItRunit
          - ConfigureIt
          - ConfigureItExplorer
          - ConfigureItPsr11
          - ConfigureItRunit
          - ConfigureItSchemaDocs
          - ConfigureItSymfony
          - ConfigureItTesting
          - DeriveIt
          - DeriveItRunit
          - DisenchantIt
          - FileIt
          - ExtendIt
          - HashIt
          - HashItAsync
          - LazeIt
          - RunIt
          - RunItThirdPartySample
    env:
      extensions: ast, grpc, opentelemetry, protobuf, yaml swoole, inotify
      # ext-grpc threads outlive grpc_shutdown(), so PHP 8.5 on ubuntu-26.04
      # segfaults at exit when grpc.so is unloaded. Skip the unload until
      # https://github.com/grpc/grpc/issues/42242 is fixed.
      ZEND_DONT_UNLOAD_MODULES: 1          
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer
          extensions: ${{ env.extensions }}

      - name: list
        run: ls

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress  ${{ matrix.composer_args }}

      - name: Build Codeception actors
        run: vendor/bin/codecept build

      - name: Set up Git identity for functional tests
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "CI Test Runner"

      - name: Run test suites
        run: composer test
