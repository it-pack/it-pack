name: Quality

on:
  push:
    paths:
      - 'src/**'
      - 'tools/qa/**'
      - '.github/workflows/quality.yml'
      - 'composer.json'
      - 'Makefile'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/qa/**'
      - '.github/workflows/quality.yml'
      - 'composer.json'
      - 'Makefile'

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.pkg }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/${{ matrix.pkg }}
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
        pkg:
          - AsyncIt
          - CommandIt
          - CommitIt
          - CommitItRunit
          - ConfigureItExplorer
          - ConfigureItPsr11
          - ConfigureItRunit
          - ConfigureItSchemaDocs
          - ConfigureItSymfony
          - ConfigureItTesting
          - DeriveItRunit
          - DisenchantIt
          - HashIt
          - RunIt
          - RunItThirdPartySample
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build Codeception actors
        run: vendor/bin/codecept build

      - name: Run quality suite
        run: composer quality
