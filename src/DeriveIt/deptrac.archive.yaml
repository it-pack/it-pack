deptrac:
  paths:
    - ./src
  layers:
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/.*
    - name: Resolver
      collectors:
        - type: directory
          value: src/Resolver/.*
    - name: Reflection
      collectors:
        - type: directory
          value: src/Reflection/.*
    - name: Telemetry
      collectors:
        - type: directory
          value: src/Telemetry/.*
    - name: Generator
      collectors:
        - type: directory
          value: src/Generator/.*
    - name: Behavior
      collectors:
        - type: directory
          value: src/Behavior/.*
    - name: Cli
      collectors:
        - type: directory
          value: src/Cli/.*
    - name: Entry
      collectors:
        - type: directory
          value: src/[^/]+\.php
  ruleset:
    Contract: ~
    Behavior: ~
    Resolver:
      - Contract
      - Behavior
    Reflection:
      - Contract
      - Resolver
      - Behavior
    Telemetry:
      - Contract
    Generator:
      - Contract
      - Reflection
      - Resolver
      - Behavior
    Cli:
      - Contract
      - Reflection
      - Resolver
      - Generator
      - Behavior
      - Entry
    Entry:
      - Contract
      - Reflection
      - Resolver
      - Generator
      - Behavior
