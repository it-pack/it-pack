namespace: Tests
support_namespace: Support
paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed
    disabled:
        - Codeception\Extension\Gherkin

coverage:
    enabled: true
    show_uncovered: true
    include:
        - src/*
    exclude:
        - tests/*
        - vendor/*
