deptrac:
  paths:
    - ./src
  layers:
    - name: Bridge
      collectors:
        - type: classNameRegex
          value: '/^ItPack\\HashItAsync\\/'
    - name: HashIt
      collectors:
        - type: classNameRegex
          value: '/^ItPack\\HashIt\\/'
    - name: AsyncIt
      collectors:
        - type: classNameRegex
          value: '/^ItPack\\AsyncIt\\/'
  ruleset:
    # The bridge may depend on HashIt (the hashing core it delegates to) and
    # AsyncIt (the runtime it fans work across). It must never reach past them
    # into RunIt or any other sibling's internals.
    Bridge:
      - HashIt
      - AsyncIt
    HashIt: ~
    AsyncIt: ~
