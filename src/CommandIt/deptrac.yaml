deptrac:
  paths:
    - ./src
  layers:
    - name: Common
      collectors:
        - type: directory
          value: src/Common/.*
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/(?!Port/).*
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
        - type: directory
          value: src/Behavior/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: SDK
      collectors:
        - type: directory
          value: src/SDK/.*
    - name: Adapter
      collectors:
        - type: directory
          value: src/Adapter/.*
    - name: Port
      collectors:
        - type: directory
          value: src/Contract/Port/.*
    - name: SymfonyConsole
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\Console/'
    - name: RunIt
      collectors:
        - type: classNameRegex
          value: '/^ItPack\\RunIt/'
  ruleset:
    Common: ~
    Contract:
      - Common
    Domain:
      - Common
      - Contract
    Port:
      - Common
      - Contract
    Application:
      - Common
      - Contract
      - Domain
      - Port
    SDK:
      - Common
      - Contract
      - Domain
      - Application
      - Port
    Adapter:
      - Common
      - Contract
      - Domain
      - Port
    # SymfonyConsole and RunIt are intentionally omitted from every allowed
    # list below, so any dependency on them from an internal layer is a
    # violation. CommandIt must remain RunIt-agnostic and Symfony-free in core.
