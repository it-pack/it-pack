deptrac:
  paths:
    - ./src
  layers:
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/(?!Port/).*
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
        - type: directory
          value: src/Behavior/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: SDK
      collectors:
        - type: directory
          value: src/SDK/.*
    - name: Adapter
      collectors:
        - type: directory
          value: src/Adapter/(?!SymfonyConsole/|CLI/).*
    - name: Bootstrap
      collectors:
        - type: directory
          value: src/Bootstrap/.*
    - name: Port
      collectors:
        - type: directory
          value: src/Contract/Port/.*
    - name: SymfonyConsole
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\Component\\Console\\/'
        - type: directory
          value: src/Adapter/CLI/.*
    - name: RunIt
      collectors:
        - type: classNameRegex
          value: '/^ItPack\\RunIt/'
  ruleset:
    Contract: ~
    Domain:
      - Contract
    Port:
      - Contract
    Application:
      - Contract
      - Domain
      - Port
    SDK:
      - Contract
      - Domain
      - Application
      - Port
    Bootstrap:
      - Contract
      - Domain
      - Application
      - SDK
      - Adapter
      - Port
    Adapter:
      - Contract
      - Domain
      - Port
    SymfonyConsole:
      - Contract
      - Domain
      - Port
    # The SymfonyConsole layer owns BOTH the vendor namespace and the CLI
    # adapter directory (src/Adapter/CLI/*): the vendor bridge may use
    # contracts, domain types, and ports, and vendor classes are actually
    # collected now, so any Symfony\Component\Console dependency from an
    # internal layer (Contract, Domain, Application, SDK, Adapter, Bootstrap)
    # is a violation. RunIt is intentionally absent from every allowed list —
    # any dependency on it from any first-party layer is a violation;
    # CommandIt must remain RunIt-agnostic and Symfony-free in core.
