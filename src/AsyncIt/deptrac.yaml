deptrac:
  paths:
    - ./src
  layers:
    - name: Common
      collectors:
        - type: directory
          value: src/Common/.*
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/(?!Port/).*
    - name: Port
      collectors:
        - type: directory
          value: src/Contract/Port/.*
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: SDK
      collectors:
        - type: directory
          value: src/SDK/.*
    - name: Adapter
      collectors:
        - type: directory
          value: src/Adapter/(Revolt|Swoole|Swow|Native|Select)/.*
    - name: Test Support
      collectors:
        - type: directory
          value: src/Conformance/.*
  ruleset:
    Common: ~
    Contract:
      - Common
    Port:
      - Common
      - Contract
    Domain:
      - Common
      - Contract
      - Port
    Application:
      - Common
      - Contract
      - Port
      - Domain
    SDK:
      - Common
      - Contract
      - Port
      - Domain
      - Application
    Adapter:
      - Common
      - Contract
      - Port
      - Domain
    Test Support:
      - Common
      - Contract
      - Port
      - Domain
      - Application
      - SDK
      - Adapter
