deptrac:
  paths:
    - ./src
  layers:
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/.*
    - name: ValueObject
      collectors:
        - type: directory
          value: src/ValueObject/.*
    - name: Core
      collectors:
        - type: directory
          value: src/Core/.*
    - name: Execution
      collectors:
        - type: directory
          value: src/Execution/.*
    - name: Cache
      collectors:
        - type: directory
          value: src/Cache/.*
    - name: Adapter
      collectors:
        - type: directory
          value: src/Adapter/.*
    - name: Bridge
      collectors:
        - type: directory
          value: src/Bridge/.*
    - name: Codegen
      collectors:
        - type: directory
          value: src/Codegen/.*
    - name: CLI
      collectors:
        - type: directory
          value: src/CLI/.*
    - name: Wiring
      collectors:
        - type: directory
          value: src/Wiring/.*
  # Baseline map (Milestone 4): encodes today's *actual* dependency edges so the
  # gate locks in the current healthy state. Tightening to enforce architectural
  # intent (e.g. forbidding Contract -> Core, Core -> Wiring) is Milestone 6 work.
  ruleset:
    Contract:
      - Contract
      - ValueObject
      - Core
      - Adapter
      - Bridge
      - Execution
    ValueObject:
      - ValueObject
      - Contract
      - Core
    Core:
      - Core
      - Contract
      - ValueObject
      - Bridge
      - Cache
      - Wiring
      - Execution
    Execution:
      - Execution
      - Contract
      - ValueObject
    Cache:
      - Cache
      - Contract
      - Core
      - Adapter
    Adapter:
      - Adapter
      - Contract
      - Core
      - Execution
      - ValueObject
    Bridge:
      - Bridge
      - Contract
      - Core
      - Execution
      - ValueObject
    Codegen:
      - Codegen
      - Contract
      - Adapter
    CLI:
      - CLI
      - Contract
      - Core
      - Adapter
      - ValueObject
    Wiring:
      - Wiring
      - Contract
      - Core
      - Adapter
      - Bridge
      - Execution
