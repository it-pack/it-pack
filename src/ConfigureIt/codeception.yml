namespace: Tests
support_namespace: Support
paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed
        - Tests\Support\Extension\VirtualFileSystemExtension

coverage:
    enabled: true
    show_uncovered: true
    include:
        - src/*
    exclude:
        - tests/*
        - src/*/docs/*
        - vendor/*
