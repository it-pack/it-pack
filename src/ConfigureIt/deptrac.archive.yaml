deptrac:
  paths:
    - ./src
  layers:
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/.*
    - name: ValueObject
      collectors:
        - type: directory
          value: src/ValueObject/.*
    - name: Core
      collectors:
        - type: directory
          value: src/Core/.*
    - name: Execution
      collectors:
        - type: directory
          value: src/Execution/.*
    - name: Cache
      collectors:
        - type: directory
          value: src/Cache/.*
    - name: Adapter
      collectors:
        - type: directory
          value: src/Adapter/.*
    - name: Bridge
      collectors:
        - type: directory
          value: src/Bridge/.*
    - name: Codegen
      collectors:
        - type: directory
          value: src/Codegen/.*
    - name: CLI
      collectors:
        - type: directory
          value: src/CLI/.*
    - name: Wiring
      collectors:
        - type: directory
          value: src/Wiring/.*
  # Tightened map (Milestone 6 / NV9 + NV10, ADR-0012): enforces intent, not
  # just today's state. Key invariants:
  #   * Contract depends only on itself + ValueObject (never Core/Adapter/Bridge/Wiring).
  #   * Core depends only on Contract + ValueObject + same-tier helpers
  #     (Cache/Execution); it must never reach Adapter/Bridge/Wiring.
  #   * ValueObject is a leaf: it may reference Contract (interfaces) but nothing
  #     upward (Core/Adapter/Bridge/...).
  #   * The composition root (Wiring) is the only layer allowed to reach
  #     Adapter/Bridge, and may depend on everything else.
  ruleset:
    Contract:
      - Contract
      - ValueObject
    ValueObject:
      - ValueObject
      - Contract
    Core:
      - Core
      - Contract
      - ValueObject
      - Cache
      - Execution
    Execution:
      - Execution
      - Contract
      - ValueObject
    Cache:
      - Cache
      - Contract
      - Core
      - Adapter
    Adapter:
      - Adapter
      - Contract
      - Core
      - Execution
      - ValueObject
    Bridge:
      - Bridge
      - Contract
      - Core
      - Execution
      - ValueObject
    Codegen:
      - Codegen
      - Contract
      - Adapter
    CLI:
      - CLI
      - Contract
      - Core
      - Adapter
      - ValueObject
    Wiring:
      - Wiring
      - Contract
      - Core
      - Adapter
      - Bridge
      - Execution
      - ValueObject
      - Cache
